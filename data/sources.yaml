# Curated scheme documents. Only documents listed here are collected.
#
# How this list was made (2026-10-24): official URLs found by web search. They have NOT been
# opened yet: `ingest fetch` downloads them on your machine and the manifest records what was
# actually fetched. Check each terms_note line before publishing processed text.
#
# Fields: scheme_id (slug), name, terms_note (terms you checked), docs: [url, optional file]
# - url only        -> fetched automatically (polite, robots.txt-aware)
# - url + file      -> you saved the page by hand into data/manual/ (browser: Ctrl+S)
# myscheme.gov.in is never fetched automatically (its Terms of Use forbid bots); its
# copyright policy allows accurate reproduction with acknowledgement, so hand-saved
# myScheme pages are a good source: https://www.myscheme.gov.in/copyright-policy
#
# Left out on purpose: MGNREGA (reported replaced by the VB-G RAM G Act, 2025, from
# 1 Jul 2026), Soil Health Card (no scheme document found), DAY-NRLM (no official
# guidelines on a government domain found).

